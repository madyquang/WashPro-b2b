# Kiểm tra tự động mỗi lần push / pull request vào main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend – build và test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: washpro-b2b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Test tích hợp dùng H2 trong bộ nhớ (profile "it"), không cần MySQL
      - run: chmod +x mvnw && ./mvnw -B clean test

  frontend:
    name: Frontend – build và lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: washpro-b2b-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: washpro-b2b-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  e2e:
    name: Docker Compose + E2E qua giao diện
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dựng toàn bộ hệ thống bằng Docker Compose (dữ liệu demo)
        run: |
          cat > .env <<'ENV'
          DB_PASSWORD=ci-db-password
          JWT_SECRET=ci-jwt-secret-chi-dung-cho-kiem-thu-tu-dong-0123456789
          BOOTSTRAP_ADMIN_USERNAME=admin
          BOOTSTRAP_ADMIN_PASSWORD=11111111
          DEMO_DATA=true
          APP_PORT=3000
          COMPANY_BANK_BIN=970436
          COMPANY_BANK_ACCOUNT=0011004012345
          COMPANY_BANK_NAME=Vietcombank
          COMPANY_HOTLINE=0909123456
          ENV
          docker compose up -d --build
      - name: Chờ backend sẵn sàng
        run: |
          # Chờ backend sinh xong dữ liệu demo và tạo tài khoản quản lý rồi mới đăng nhập thử:
          # đăng nhập dồn dập khi tài khoản chưa có sẽ bị khóa tạm 5 phút (chống dò mật khẩu)
          for i in $(seq 1 90); do
            if docker compose logs backend | grep -q "Đã tạo tài khoản Quản lý xưởng đầu tiên"; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login \
                -H 'Content-Type: application/json' -d '{"username":"admin","password":"11111111"}' || true)
              [ "$code" = "200" ] && echo "Sẵn sàng sau ${i}x2s" && exit 0
              echo "Đăng nhập thử qua nginx trả về HTTP $code"
              break
            fi
            sleep 2
          done
          docker compose logs backend | tail -100
          docker compose logs frontend | tail -30
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: washpro-b2b-frontend/package-lock.json
      - name: Chạy bộ E2E
        working-directory: washpro-b2b-frontend
        env:
          E2E_APP_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3000/api
          E2E_PWA: '1'
          E2E_QR: '1'
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          npm run test:e2e
      - name: Sao lưu CSDL + ảnh, khôi phục thử vào CSDL khác
        run: |
          docker compose logs backup | grep "Sao lưu tự động mỗi ngày"
          docker compose exec -T backup sh /backup/backup.sh
          f=$(ls backups/washpro-*.sql.gz | head -1)
          echo "Bản sao lưu: $f"
          test "$(find backups/uploads -type f | wc -l)" -gt 0
          docker compose exec -T -e DB_NAME=restore_test backup sh /backup/restore.sh "/backups/$(basename "$f")"
          same=$(docker compose exec -T backup mysql -h mysql -uroot -N -e             "SELECT (SELECT COUNT(*) FROM washpro_b2b.orders) = (SELECT COUNT(*) FROM restore_test.orders)
                AND (SELECT COUNT(*) FROM washpro_b2b.order_attachments) = (SELECT COUNT(*) FROM restore_test.order_attachments)
                AND (SELECT COUNT(*) FROM restore_test.orders) > 0")
          test "$same" = "1"
      - name: Lưu ảnh chụp / log khi lỗi
        if: failure()
        run: docker compose logs backend > washpro-b2b-frontend/e2e/results/backend.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: washpro-b2b-frontend/e2e/results/
