# Chạy toàn bộ hệ thống: MySQL + backend + giao diện.
#   cp docker.env.example .env      (điền mật khẩu CSDL, JWT_SECRET, tài khoản quản lý xưởng đầu tiên)
#   docker compose up -d --build
#   mở http://localhost:3000
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: washpro_b2b
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong file .env}
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./washpro-b2b
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/washpro_b2b?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET (tối thiểu 32 ký tự) trong file .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEMO_DATA: ${DEMO_DATA:-false}
      # Truy cập qua địa chỉ khác (tên miền, HTTPS ở proxy ngoài): khai báo địa chỉ đó trong CORS_ALLOWED_ORIGINS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COMPANY_NAME: ${COMPANY_NAME:-Xưởng giặt là THANHXUAN}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_TAX_CODE: ${COMPANY_TAX_CODE:-}
      COMPANY_BANK_NAME: ${COMPANY_BANK_NAME:-}
      COMPANY_BANK_BIN: ${COMPANY_BANK_BIN:-}
      COMPANY_BANK_ACCOUNT: ${COMPANY_BANK_ACCOUNT:-}
      COMPANY_ACCOUNT_HOLDER: ${COMPANY_ACCOUNT_HOLDER:-}
    volumes:
      # Ảnh / chữ ký đính kèm đơn
      - uploads:/app/uploads

  # Sao lưu CSDL + ảnh đính kèm mỗi ngày vào thư mục ./backups trên máy chủ (xem backup/*.sh)
  backup:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["sh", "/backup/schedule.sh"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_PWD: ${DB_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads

  frontend:
    build:
      context: ./washpro-b2b-frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-3000}:80"

volumes:
  mysql-data:
  uploads:
