server {
    listen 80;
    root /usr/share/nginx/html;

    # Cho phép gửi dữ liệu lớn qua API
    client_max_body_size 20m;

    # API: chuyển sang backend (cùng địa chỉ với giao diện)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        # Giữ nguyên Host kèm cổng (VD localhost:3000): backend so Origin của trình duyệt với Host để biết là cùng nguồn,
        # thiếu cổng sẽ bị coi là gọi khác nguồn và bị CORS chặn (403)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gói JS/CSS có mã băm trong tên: cache lâu
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả về index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
