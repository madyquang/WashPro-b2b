# Cấu hình cho test tích hợp: H2 trong bộ nhớ (chế độ MySQL), không phụ thuộc file .env hay MySQL cục bộ
spring.datasource.url=jdbc:h2:mem:washpro_it;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Migration Flyway viết cho MySQL; test H2 dựng bảng từ entity
spring.flyway.enabled=false

app.jwt.secret=integration-test-secret-key-at-least-32-chars
app.bootstrap-admin.username=
app.bootstrap-admin.password=
app.demo-data.enabled=false

# Ảnh đính kèm của test ghi vào thư mục tạm
app.uploads.dir=${java.io.tmpdir}/washpro-it-uploads

app.company.hotline=0909 123 456

# Ngân hàng nhận tiền (để kiểm tra mã QR VietQR trên hóa đơn)
app.company.bank-bin=970436
app.company.bank-account=0011004012345
app.company.bank-name=Vietcombank

# Thông báo đẩy: test dùng máy chủ push giả chạy trên localhost
app.push.allow-any-endpoint=true
