spring.application.name=washpro-b2b

# Đọc biến môi trường từ file .env (nếu có) đặt cạnh pom.xml. Xem .env.example
spring.config.import=optional:file:.env[.properties]

# ===== Cơ sở dữ liệu =====
# DB_PASSWORD bắt buộc phải cấu hình (không có giá trị mặc định để tránh lộ mật khẩu trong mã nguồn)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/washpro_b2b?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# Cấu trúc bảng do Flyway quản lý (src/main/resources/db/migration); Hibernate chỉ kiểm tra khớp, không tự sửa bảng
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# ===== Flyway =====
# CSDL đã có bảng từ trước khi dùng Flyway (do Hibernate tạo): đánh dấu đã ở V1 rồi chạy tiếp V2 trở đi.
# CSDL rỗng: chạy từ V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Tắt open-in-view: mọi truy vấn dữ liệu phải nằm trong Service (@Transactional)
spring.jpa.open-in-view=false

# ===== JWT =====
# JWT_SECRET bắt buộc, tối thiểu 32 ký tự
app.jwt.secret=${JWT_SECRET}
# Thời hạn token (mili giây). Mặc định 8 giờ
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ===== CORS: danh sách origin được phép, ngăn cách bằng dấu phẩy =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== Chống dò mật khẩu =====
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.lock-minutes=${LOGIN_LOCK_MINUTES:5}

# ===== Tài khoản quản lý xưởng đầu tiên (chỉ tạo khi hệ thống chưa có quản lý xưởng nào) =====
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ===== Dữ liệu demo để xem thử (KHÔNG bật trên hệ thống thật) =====
# DEMO_DATA=true: lần khởi động đó sinh khách hàng, đơn, thanh toán mẫu (mật khẩu 11111111). Xóa: docs/xoa-du-lieu-demo.sql
app.demo-data.enabled=${DEMO_DATA:false}

# ===== Không để lộ chi tiết lỗi nội bộ ra ngoài =====
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
